name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    # Integration tests start Postgres and a mock OIDC provider with testcontainers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  sqlx-metadata:
    # Fails if .sqlx/ is stale relative to the queries and migrations.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      SQLX_OFFLINE: "false"
      DATABASE_URL: postgres://pdms_owner:owner@localhost:5432/pdms
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -v owner_password=owner -v app_password=app -f deploy/postgres/00_roles.sql
      - run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - run: sqlx migrate run --source migrations
      - run: cargo sqlx prepare --workspace --check -- --all-targets

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pdms:ci .
      - run: docker run --rm pdms:ci --version
