<div class="hbars" role="img" aria-label="{{ chart.aria }}">
  {% for b in chart.bars %}
  <div class="hbar-row">
    <span class="hbar-label">{{ b.label }}</span>
    <span class="hbar-track">
      {% if b.pct > 0.0 %}<svg class="hbar" width="{{ b.pct }}%" height="16"><g class="{{ bar_class }}"><title>{{ b.label }}: {{ b.value }}</title><rect x="0" y="0" width="100%" height="16" rx="4"/><rect x="0" y="0" width="50%" height="16"/></g></svg>{% endif %}
      <span class="hbar-value">{{ b.value }}</span>
    </span>
  </div>
  {% endfor %}
</div>
