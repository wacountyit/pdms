<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} – {{ org_name }}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/theme.css?v={{ theme_version }}">
</head>
<body class="error-body">
  <main id="main" class="panel error-panel">
    <p class="error-org">{{ org_name }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <p class="muted">Error {{ status }}</p>
    <p><a class="button primary" href="/">Back to the dashboard</a></p>
  </main>
  <footer class="site-footer"><a href="/source">Source code</a> · <a href="/license">License: AGPL-3.0-or-later</a></footer>
</body>
</html>
