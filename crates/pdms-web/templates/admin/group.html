{% extends "base.html" %}
{% block content %}
<p><a href="/admin/groups">← All groups</a></p>
<p>{{ g.description }}</p>
<table>
  <caption>Members</caption>
  <thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Source</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
  <tbody>
  {% for m in members %}
    <tr><td><a href="/admin/users/{{ m.user_id }}">{{ m.display_name }}</a></td><td>{{ m.email }}</td><td>{{ m.source.as_str() }}</td>
    <td><form method="post" action="/admin/groups/{{ g.id }}/members/{{ m.user_id }}/remove"><input type="hidden" name="_csrf" value="{{ l.csrf }}"><button type="submit" class="danger small">Remove</button></form></td></tr>
  {% else %}<tr><td colspan="4">No members.</td></tr>{% endfor %}
  </tbody>
</table>
<form method="post" action="/admin/groups/{{ g.id }}/members" class="inline">
  <input type="hidden" name="_csrf" value="{{ l.csrf }}">
  <label for="u">Add member</label>
  <select id="u" name="user_id" required>{% for u in users %}<option value="{{ u.id }}">{{ u.display_name }} ({{ u.email }})</option>{% endfor %}</select>
  <button type="submit">Add</button>
</form>
{% endblock %}
